<!DOCTYPE html>
<html>
    <head>
        <title>Gatito</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="card">
            <img id="cat-img" src="assets/images/cat.jpg" alt="Un gato normal">
            <video id="cat-video"></video>
            <h3 id="title-card">Gato normal</h3>
            <div class="row-buttons">
                <button id="laughter" class="cat-btn" onclick="playMeme('assets/videos/laughter.mp4', 'JAJAJA')">JAJA</button>
                <button id="scuba" class="cat-btn" onclick="playMeme('assets/videos/scuba.mp4', 'Loba Loba')">Loba</button>
                <button id="bouncy" class="cat-btn" onclick="playMeme('assets/videos/bouncy.mp4', 'Boing Boing')">Boing</button>
                <button id="muhehehe" class="cat-btn" onclick="playMeme('assets/videos/muhehehe.mp4', 'Muhehehe')">Muehehe</button>
                <button id="damdam" class="cat-btn" onclick="playMeme('assets/videos/damdam.mp4', 'Dam Dam Didi')">Dam Dam</button>
            </div>
        </div>
    </body>
</html>
