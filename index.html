<!DOCTYPE html>
<html>
    <head>
        <title>Gatito</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" href="assets/images/favicon.png">
        <script src="script.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="card">
            <img id="cat-img" src="assets/images/cat.jpg" alt="Un gato normal">
            <video id="cat-video"></video>
            <h3 id="title-card">Gato normal</h3>
            <div id="meme-buttons-container">
                <button class="cat-btn" data-url="assets/videos/laughter.mp4" data-text="JAJAJAJAJA">JAJA</button>
                <button class="cat-btn" data-url="assets/videos/scuba.mp4" data-text="Loba Loba">Loba</button>
                <button class="cat-btn" data-url="assets/videos/bouncy.mp4" data-text="Boing Boing">Boing</button>
                <button class="cat-btn" data-url="assets/videos/muhehehe.mp4" data-text="Muhehehe">Muehehe</button>
                <button class="cat-btn" data-url="assets/videos/ruffles.mp4" data-text="Gato comiendo ruffles">Ruffles</button>
                <button class="cat-btn" data-url="assets/videos/damdam.mp4" data-text="Dam Dam Didi">Dam Dam</button>
            </div>
        </div>
    </body>
</html>
